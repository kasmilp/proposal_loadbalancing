<text x='40' y='1060.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='12.5' font-weight='normal' fill='#55636E' text-anchor='start'>Keterangan: panah merah = gap yang dijawab komponen; panah merah putus-putus = jawaban parsial. Panah hijau = komponen yang menjadi dasar kontribusi.</text>
<text x='40' y='1076.875' font-family='DejaVu Sans, Arial, sans-serif' font-size='12.5' font-weight='normal' fill='#55636E' text-anchor='start'>Klaim "belum ada" untuk D1–D3 hanya boleh ditulis setelah log pencarian lintas basis data (aturan repo); G3 wajib diverifikasi lebih dulu.</text>
